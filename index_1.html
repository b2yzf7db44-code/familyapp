// ---------- Storage: Firebase Firestore (shared across the whole family) ----------
// One document holds the whole board, so every phone reads/writes the same thing.
// Change FAMILY_ID if you ever want a second, separate board.
const FAMILY_ID = "home";

const db = firebase.firestore();
const boardRef = db.collection("families").doc(FAMILY_ID);

// Keep working (read-only-ish) if the phone briefly loses signal.
db.enablePersistence({ synchronizeTabs: true }).catch(function () {
  /* multiple tabs open, or unsupported browser - not fatal */
});

const storage = {
  async get(key) {
    const snap = await boardRef.get();
    if (!snap.exists) return null;
    const d = snap.data();
    if (!d || d.value == null) return null;
    return { key, value: d.value, shared: true };
  },
  async set(key, value) {
    await boardRef.set(
      { value: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },
      { merge: true }
    );
    return { key, value, shared: true };
  },
  async delete(key) {
    await boardRef.delete();
    return { key, deleted: true, shared: true };
  },
  // Live updates: fires whenever anyone in the family changes the board.
  subscribe(onChange, onError) {
    return boardRef.onSnapshot(
      function (snap) {
        if (!snap.exists) {
          onChange(null);
          return;
        }
        const d = snap.data();
        onChange(d && d.value != null ? d.value : null);
      },
      function (err) {
        if (onError) onError(err);
      }
    );
  },
};

function loadFallback() {
  return {
    shoppingLists: [],
    trips: [],
    packingTemplate: DEFAULT_PACKING_TEMPLATE.map((text) => ({ id: uid(), text })),
  };
}

// Older saved data won't have the newer fields — fill them in so nothing crashes.
function normalizeData(raw) {
  const d = raw || {};
  return {
    shoppingLists: d.shoppingLists || [],
    trips: (d.trips || []).map((t) => ({
      ...t,
      items: t.items || [],
      packing: t.packing || [],
      shopping: t.shopping || [],
      days: t.days || [],
    })),
    packingTemplate:
      d.packingTemplate ||
      DEFAULT_PACKING_TEMPLATE.map((text) => ({ id: uid(), text })),
  };
}

function FamilyApp() {
  const [tab, setTab] = useState("grocery");
  const [data, setData] = useState(null);
  const [syncing, setSyncing] = useState(true);
  const [lastSynced, setLastSynced] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");

  const [wizardOpen, setWizardOpen] = useState(false);
  const [w, setW] = useState(emptyWizard);
  const [expandedListId, setExpandedListId] = useState(null);
  const [confirmClearAll, setConfirmClearAll] = useState(false);
  const [extraItemText, setExtraItemText] = useState({});

  const [showNewTrip, setShowNewTrip] = useState(false);
  const [newTripTitle, setNewTripTitle] = useState("");
  const [newTripPlace, setNewTripPlace] = useState("");
  const [newTripStart, setNewTripStart] = useState("");
  const [newTripEnd, setNewTripEnd] = useState("");
  const [openTripId, setOpenTripId] = useState(null);
  const [editTripDraft, setEditTripDraft] = useState(null);
  const [tripTab, setTripTab] = useState("itinerary");
  const [dayDrafts, setDayDrafts] = useState({});
  const [viewPhoto, setViewPhoto] = useState(null);
  const [templateOpen, setTemplateOpen] = useState(false);
  const [newTemplateText, setNewTemplateText] = useState("");
  const [newPackText, setNewPackText] = useState({});
  const [confirmResetPack, setConfirmResetPack] = useState(false);
  const [newShopText, setNewShopText] = useState({});
  const [newShopWhere, setNewShopWhere] = useState({});
  const [newTaskText, setNewTaskText] = useState({});

  const dataRef = useRef(data);
  dataRef.current = data;

  const fetchData = useCallback(async (isInitial) => {
    try {
      if (isInitial) setSyncing(true);
      const res = await storage.get(STORAGE_KEY);
      const parsed = res ? JSON.parse(res.value) : loadFallback();
      setData(normalizeData(parsed));
      setLastSynced(new Date());
      setErrorMsg("");
    } catch (e) {
      if (isInitial) setData(loadFallback());
      setErrorMsg("連接唔到資料庫：" + (e && e.message ? e.message : e));
    } finally {
      if (isInitial) setSyncing(false);
    }
  }, []);

  const persist = useCallback(async (partial) => {
    // Merge, so callers can pass only the slice they changed without
    // accidentally wiping the others (e.g. packingTemplate).
    const next = { ...(dataRef.current || loadFallback()), ...partial };
    setData(next);
    try {
      await storage.set(STORAGE_KEY, JSON.stringify(next));
      setLastSynced(new Date());
      setErrorMsg("");
    } catch (e) {
      setErrorMsg("寫入失敗：" + (e && e.message ? e.message : e));
    }
  }, []);

  useEffect(() => {
    let cancelled = false;
    setSyncing(true);

    // Live listener: any change made on any family member's phone lands here.
    const unsubscribe = storage.subscribe(
      function (rawValue) {
        if (cancelled) return;
        let parsed = loadFallback();
        if (rawValue != null) {
          try {
            parsed = JSON.parse(rawValue);
          } catch (e) {
            parsed = loadFallback();
          }
        }
        setData(normalizeData(parsed));
        setLastSynced(new Date());
        setErrorMsg("");
        setSyncing(false);
      },
      function (err) {
        if (cancelled) return;
        setData(function (d) {
          return d || loadFallback();
        });
        setErrorMsg("連接唔到資料庫：" + (err && err.message ? err.message : err));
        setSyncing(false);
      }
    );

    return function () {
      cancelled = true;
      unsubscribe();
    };
  }, []);

          <div className="fh-spinner" />

  const { shoppingLists, trips, packingTemplate } = data;

  // ---------- Wizard logic ----------
  const startWizard = () => {
    setW(emptyWizard);
    setWizardOpen(true);
  };

    setW({ ...emptyWizard, date: todayStr, outlet: outletKey, step: 3 });

  };

    if (shoppingLists.length === 0) return;

      ...emptyWizard,
      date: todayStr,
      outlet: last.outlet,
      categories: [...last.categories],
      step: 4,
    });
    setWizardOpen(true);
  };

    setWizardOpen(false);
    setW(emptyWizard);
  };
  const pickDate = (d) => setW((s) => ({ ...s, date: d }));
  const pickOutlet = (key) =>
    setW((s) => ({ ...s, outlet: key, customOutletMode: false }));
  const pickCustomOutlet = () =>
    setW((s) => ({ ...s, outlet: "", customOutletMode: true }));
  const toggleCategory = (cat) =>
    setW((s) => ({
      ...s,
      categories: s.categories.includes(cat)
        ? s.categories.filter((c) => c !== cat)
        : [...s.categories, cat],
    }));
  const confirmAddCategory = () => {
    const name = w.newCategoryText.trim();
    if (!name) return;
    setW((s) => ({
      ...s,
      categories: s.categories.includes(name) ? s.categories : [...s.categories, name],
      addingCategory: false,
      newCategoryText: "",
    }));
  };
  const toggleWizardItem = (cat, item) =>
    setW((s) => {
      const cur = s.itemsByCat[cat] || [];
      const next = cur.includes(item) ? cur.filter((i) => i !== item) : [...cur, item];
      return { ...s, itemsByCat: { ...s.itemsByCat, [cat]: next } };
    });
  const confirmAddWizardItem = (cat) => {
    const text = (w.customItemText[cat] || "").trim();
    if (!text) return;
    setW((s) => {
      const cur = s.itemsByCat[cat] || [];
      return {
        ...s,
        itemsByCat: { ...s.itemsByCat, [cat]: cur.includes(text) ? cur : [...cur, text] },
        customItemText: { ...s.customItemText, [cat]: "" },
      };
    });
  };

  const totalWizardItems = Object.values(w.itemsByCat).reduce(
    (sum, arr) => sum + arr.length,
    0
  );
  const finalOutlet = w.customOutletMode ? w.customOutlet.trim() : w.outlet;

  const canGoNext =
    (w.step === 1 && !!w.date) ||
    (w.step === 2 && !!finalOutlet) ||
    (w.step === 3 && w.categories.length > 0);

  const nextStep = () => setW((s) => ({ ...s, step: Math.min(4, s.step + 1) }));
  const prevStep = () => setW((s) => ({ ...s, step: Math.max(1, s.step - 1) }));

  const finishWizard = () => {
    const items = [];
    w.categories.forEach((cat) => {
      (w.itemsByCat[cat] || []).forEach((name) =>
        items.push({ id: uid(), name, category: cat, done: false })
      );
    });
    if (items.length === 0) return;
    const newList = {
      id: uid(),
      date: w.date,
      outlet: finalOutlet,
      categories: [...w.categories],
      items,
    };
    persist({ shoppingLists: [newList, ...shoppingLists], trips });
    setWizardOpen(false);
    setW(emptyWizard);
    setExpandedListId(newList.id);
  };

  // ---------- Shopping list (post-creation) logic ----------
  const toggleShopItem = (listId, itemId) => {
    persist({
      shoppingLists: shoppingLists.map((l) =>
        l.id === listId
          ? {
              ...l,
              items: l.items.map((it) =>
                it.id === itemId ? { ...it, done: !it.done } : it
              ),
            }
          : l
      ),
      trips,
    });
  };
  const deleteShopItem = (listId, itemId) => {
    persist({
      shoppingLists: shoppingLists.map((l) =>
        l.id === listId ? { ...l, items: l.items.filter((it) => it.id !== itemId) } : l
      ),
      trips,
    });
  };
  const deleteShoppingList = (listId) => {
    persist({ shoppingLists: shoppingLists.filter((l) => l.id !== listId), trips });
  };
  const clearAllShoppingLists = () => {
    persist({ shoppingLists: [], trips });
    setConfirmClearAll(false);
    setExpandedListId(null);
  };
  const addPresetToList = (listId, cat, name) => {
    persist({
      shoppingLists: shoppingLists.map((l) =>
        l.id === listId
          ? { ...l, items: [...l.items, { id: uid(), name, category: cat, done: false }] }
          : l
      ),
      trips,
    });
  };
  const addCustomToList = (listId, cat) => {
    const key = `${listId}:${cat}`;
    const text = (extraItemText[key] || "").trim();
    if (!text) return;
    addPresetToList(listId, cat, text);
    setExtraItemText((s) => ({ ...s, [key]: "" }));
  };

  // ---------- Extend an existing list with a new category (steps 3→4 again) ----------
  const openExtend = (listId) => setExtend({ ...emptyExtend, listId });
  const closeExtend = () => setExtend(emptyExtend);
  const toggleExtendCategory = (cat) =>
    setExtend((s) => ({
      ...s,
      categories: s.categories.includes(cat)
        ? s.categories.filter((c) => c !== cat)
        : [...s.categories, cat],
    }));
  const confirmAddExtendCategory = () => {
    const name = extend.newCategoryText.trim();
    if (!name) return;
    setExtend((s) => ({
      ...s,
      categories: s.categories.includes(name) ? s.categories : [...s.categories, name],
      addingCategory: false,
      newCategoryText: "",
    }));
  };
  const toggleExtendItem = (cat, item) =>
    setExtend((s) => {
      const cur = s.itemsByCat[cat] || [];
      const next = cur.includes(item) ? cur.filter((i) => i !== item) : [...cur, item];
      return { ...s, itemsByCat: { ...s.itemsByCat, [cat]: next } };
    });
  const confirmAddExtendItem = (cat) => {
    const text = (extend.customItemText[cat] || "").trim();
    if (!text) return;
    setExtend((s) => {
      const cur = s.itemsByCat[cat] || [];
      return {
        ...s,
        itemsByCat: { ...s.itemsByCat, [cat]: cur.includes(text) ? cur : [...cur, text] },
        customItemText: { ...s.customItemText, [cat]: "" },
      };
    });
  };
  const extendTotalItems = Object.values(extend.itemsByCat).reduce(
    (sum, arr) => sum + arr.length,
    0
  );
  const finishExtend = () => {
    const newItems = [];
    extend.categories.forEach((cat) => {
      (extend.itemsByCat[cat] || []).forEach((name) =>
        newItems.push({ id: uid(), name, category: cat, done: false })
      );
    });
    if (newItems.length === 0) return;
    persist({
      shoppingLists: shoppingLists.map((l) =>
        l.id === extend.listId
          ? {
              ...l,
              categories: [
                ...l.categories,
                ...extend.categories.filter((c) => !l.categories.includes(c)),
              ],
              items: [...l.items, ...newItems],
            }
          : l
      ),
      trips,
    });
    closeExtend();
  };

  // ---------- Travel logic (unchanged) ----------
  // ---------- Trips ----------
  const addTrip = () => {
    const title = newTripTitle.trim();
    if (!title) return;
    const trip = {
      id: uid(),
      title,
      place: newTripPlace.trim(),
      start: newTripStart,
      end: newTripEnd,
      items: [],
      // Copy the template in. Ticking things off here never touches the template.
      packing: (packingTemplate || []).map((t) => ({
        id: uid(),
        text: t.text,
        done: false,
      })),
      shopping: [],
      days: [],
    };
    persist({ trips: [trip, ...trips] });
    setNewTripTitle("");
    setNewTripPlace("");
    setNewTripStart("");
    setNewTripEnd("");
    setShowNewTrip(false);
    setOpenTripId(trip.id);
    setTripTab("itinerary");
  };
  const deleteTrip = (id) => {
    persist({ trips: trips.filter((t) => t.id !== id) });
    setOpenTripId(null);
    setEditTripDraft(null);
  };

  const updateTrip = (tripId, updater) => {
    persist({ trips: trips.map((t) => (t.id === tripId ? updater(t) : t)) });
  };

  // ---------- Edit trip place / dates ----------
  const startEditTrip = (t) =>
    setEditTripDraft({ place: t.place || "", start: t.start || "", end: t.end || "" });
  const cancelEditTrip = () => setEditTripDraft(null);
  const saveEditTrip = (tripId) => {
    if (!editTripDraft) return;
    updateTrip(tripId, (t) => ({
      ...t,
      place: editTripDraft.place.trim(),
      start: editTripDraft.start,
      end: editTripDraft.end,
    }));
    setEditTripDraft(null);
  };

  // ---------- 行程：day-by-day itinerary ----------
  const addDay = (tripId) =>
    updateTrip(tripId, (t) => ({
      ...t,
      days: [
        ...(t.days || []),
        { id: uid(), morning: "", afternoon: "", evening: "", stay: "" },
      ],
    }));
  const removeDay = (tripId, dayId) =>
    updateTrip(tripId, (t) => ({
      ...t,
      days: (t.days || []).filter((d) => d.id !== dayId),
    }));
  const dayDraftKey = (tripId, dayId, field) => tripId + ":" + dayId + ":" + field;
  const getDayFieldValue = (tripId, day, field) => {
    const k = dayDraftKey(tripId, day.id, field);
    return k in dayDrafts ? dayDrafts[k] : day[field] || "";
  };
  const onDayFieldChange = (tripId, dayId, field, value) => {
    setDayDrafts((s) => ({ ...s, [dayDraftKey(tripId, dayId, field)]: value }));
  };
  const commitDayField = (tripId, dayId, field) => {
    const k = dayDraftKey(tripId, dayId, field);
    if (!(k in dayDrafts)) return;
    const value = dayDrafts[k];
    updateTrip(tripId, (t) => ({
      ...t,
      days: (t.days || []).map((d) => (d.id === dayId ? { ...d, [field]: value } : d)),
    }));
    setDayDrafts((s) => {
      const next = { ...s };
      delete next[k];
      return next;
    });
  };

  // ---------- 買嘢：photo attach (resized + compressed, stored inline) ----------
  const attachShopPhoto = (tripId, itemId, file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 640;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
        updateTrip(tripId, (t) => ({
          ...t,
          shopping: t.shopping.map((i) =>
            i.id === itemId ? { ...i, photo: dataUrl } : i
          ),
        }));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };
  const removeShopPhoto = (tripId, itemId) =>
    updateTrip(tripId, (t) => ({
      ...t,
      shopping: t.shopping.map((i) => (i.id === itemId ? { ...i, photo: null } : i)),
    }));

  // ---------- 行程 to-dos ----------
  const addTask = (tripId) => {
    const text = (newTaskText[tripId] || "").trim();
    if (!text) return;
    updateTrip(tripId, (t) => ({
      ...t,
      items: [...t.items, { id: uid(), text, done: false }],
    }));
    setNewTaskText((s) => ({ ...s, [tripId]: "" }));
  };
  const toggleTask = (tripId, taskId) =>
    updateTrip(tripId, (t) => ({
      ...t,
      items: t.items.map((it) => (it.id === taskId ? { ...it, done: !it.done } : it)),
    }));
  const deleteTask = (tripId, taskId) =>
    updateTrip(tripId, (t) => ({
      ...t,
      items: t.items.filter((it) => it.id !== taskId),
    }));

  // ---------- 執嘢 (this trip's copy) ----------
  const togglePack = (tripId, packId) =>
    updateTrip(tripId, (t) => ({
      ...t,
      packing: t.packing.map((p) => (p.id === packId ? { ...p, done: !p.done } : p)),
    }));
  const deletePack = (tripId, packId) =>
    updateTrip(tripId, (t) => ({
      ...t,
      packing: t.packing.filter((p) => p.id !== packId),
    }));
  const addPack = (tripId) => {
    const text = (newPackText[tripId] || "").trim();
    if (!text) return;
    updateTrip(tripId, (t) => ({
      ...t,
      packing: [...t.packing, { id: uid(), text, done: false }],
    }));
    setNewPackText((s) => ({ ...s, [tripId]: "" }));
  };
  const resetPackFromTemplate = (tripId) => {
    updateTrip(tripId, (t) => ({
      ...t,
      packing: (packingTemplate || []).map((tp) => ({
        id: uid(),
        text: tp.text,
        done: false,
      })),
    }));
    setConfirmResetPack(false);
  };
  // Promote a one-off item into the shared template.
  const addPackToTemplate = (text) => {
    if ((packingTemplate || []).some((t) => t.text === text)) return;
    persist({ packingTemplate: [...(packingTemplate || []), { id: uid(), text }] });
  };

  // ---------- 執行李範本 ----------
  const addTemplateItem = () => {
    const text = newTemplateText.trim();
    if (!text) return;
    if ((packingTemplate || []).some((t) => t.text === text)) {
      setNewTemplateText("");
      return;
    }
    persist({ packingTemplate: [...(packingTemplate || []), { id: uid(), text }] });
    setNewTemplateText("");
  };
  const deleteTemplateItem = (id) =>
    persist({ packingTemplate: (packingTemplate || []).filter((t) => t.id !== id) });

  // ---------- 旅行買嘢 ----------
  const addTripShop = (tripId) => {
    const name = (newShopText[tripId] || "").trim();
    if (!name) return;
    updateTrip(tripId, (t) => ({
      ...t,
      shopping: [
        ...t.shopping,
        { id: uid(), name, shop: (newShopWhere[tripId] || "").trim(), done: false },
      ],
    }));
    setNewShopText((s) => ({ ...s, [tripId]: "" }));
    setNewShopWhere((s) => ({ ...s, [tripId]: "" }));
  };
  const toggleTripShop = (tripId, itemId) =>
    updateTrip(tripId, (t) => ({
      ...t,
      shopping: t.shopping.map((i) => (i.id === itemId ? { ...i, done: !i.done } : i)),
    }));
  const deleteTripShop = (tripId, itemId) =>
    updateTrip(tripId, (t) => ({
      ...t,
      shopping: t.shopping.filter((i) => i.id !== itemId),
    }));

  const openTrip = openTripId ? trips.find((t) => t.id === openTripId) : null;
  const sortedTrips = [...trips].sort((a, b) => {
    if (!a.start && !b.start) return 0;
    if (!a.start) return 1;
    if (!b.start) return -1;
    return a.start.localeCompare(b.start);
  });

  const activeListCount = shoppingLists.filter((l) =>
    l.items.some((it) => !it.done)
  ).length;

  return (
    <div className="fh-app">
      <StyleBlock />

      <header className="fh-header">
        <div className="fh-header-top">
          <div className="fh-logo">
            <HouseMark />
            <h1>FamilyApp</h1>
          </div>
          <button className="fh-sync-btn" onClick={() => fetchData(false)} title="手動同步">
            <RefreshCw size={15} className={syncing ? "fh-spin" : ""} />
          </button>
        </div>

        <nav className="fh-tabs">
          <button className={"fh-tab-shop " + (tab === "grocery" ? "active" : "")} onClick={() => setTab("grocery")}>
            <ShoppingBag size={16} />
            購物清單
            {activeListCount > 0 && <span className="fh-badge">{activeListCount}</span>}
          </button>
          <button className={"fh-tab-travel " + (tab === "travel" ? "active" : "")} onClick={() => setTab("travel")}>
            <Plane size={16} />
            旅行計劃
            {trips.length > 0 && <span className="fh-badge">{trips.length}</span>}
          </button>
        </nav>
      </header>

      <div className="fh-torn" />

      <main className="fh-main">
        {errorMsg && <div className="fh-error">{errorMsg}</div>}

        {tab === "grocery" && (
          <section className="fh-shop-section">
            {wizardOpen ? (
              <div className="fh-receipt fh-wizard">
                <div className="fh-wizard-head">
                  <span>新增購物清單</span>
                  <button className="fh-wizard-close" onClick={cancelWizard}>
                    <X size={16} />
                  </button>
                </div>
                <div className="fh-wizard-dots">
                  {[1, 2, 3, 4].map((n) => (
                    <span key={n} className={`fh-step-dot ${w.step >= n ? "active" : ""}`} />
                  ))}
                </div>

                {w.step === 1 && (
                  <div className="fh-wizard-body">
                    <p className="fh-wizard-q">
                      <Calendar size={15} /> 幾時去買？
                    </p>
                    <div className="fh-chip-grid">
                      <button
                        className={`fh-chip ${w.date === todayStr ? "active" : ""}`}
                        onClick={() => pickDate(todayStr)}
                      >
                        今日
                      </button>
                      <button
                        className={`fh-chip ${w.date === tomorrowStr ? "active" : ""}`}
                        onClick={() => pickDate(tomorrowStr)}
                      >
                        聽日
                      </button>
                      <button
                        className={`fh-chip ${w.date === satStr ? "active" : ""}`}
                        onClick={() => pickDate(satStr)}
                      >
                        呢個週末
                      </button>
                    </div>
                    <input
                      type="date"
                      className="fh-date-input"
                      value={w.date}
                      onChange={(e) => pickDate(e.target.value)}
                    />
                  </div>
                )}

                {w.step === 2 && (
                  <div className="fh-wizard-body">
                    <p className="fh-wizard-q">
                      <ShoppingCart size={15} /> 去邊度買？
                    </p>
                    <div className="fh-chip-grid">
                      {OUTLETS.map((o) => (
                        <button
                          key={o.key}
                          className={`fh-chip ${w.outlet === o.key ? "active" : ""}`}
                          onClick={() => pickOutlet(o.key)}
                        >
                          {o.emoji} {o.key}
                        </button>
                      ))}
                      <button
                        className={`fh-chip ${w.customOutletMode ? "active" : ""}`}
                        onClick={pickCustomOutlet}
                      >
                        ✏️ 其他
                      </button>
                    </div>
                    {w.customOutletMode && (
                      <input
                        className="fh-date-input"
                        placeholder="自訂店舖名稱"
                        value={w.customOutlet}
                        onChange={(e) =>
                          setW((s) => ({ ...s, customOutlet: e.target.value }))
                        }
                      />
                    )}
                  </div>
                )}

                {w.step === 3 && (
                  <div className="fh-wizard-body">
                    <p className="fh-wizard-q">
                      <Tag size={15} /> 想買邊類嘢？（可揀多個）
                    </p>
                    <div className="fh-chip-grid">
                      {w.categories
                        .filter((c) => !CATEGORY_LIST.includes(c))
                        .concat(CATEGORY_LIST)
                        .map((cat) => (
                          <button
                            key={cat}
                            className={`fh-chip ${w.categories.includes(cat) ? "active" : ""}`}
                            onClick={() => toggleCategory(cat)}
                          >
                            {CATEGORY_META[cat] || "🏷️"} {cat}
                          </button>
                        ))}
                    </div>
                    {!w.addingCategory ? (
                      <button
                        className="fh-add-custom-chip"
                        onClick={() => setW((s) => ({ ...s, addingCategory: true }))}
                      >
                        <Plus size={13} /> 自訂類別
                      </button>
                    ) : (
                      <div className="fh-inline-add">
                        <input
                          autoFocus
                          placeholder="新類別名稱"
                          value={w.newCategoryText}
                          onChange={(e) =>
                            setW((s) => ({ ...s, newCategoryText: e.target.value }))
                          }
                          onKeyDown={(e) => e.key === "Enter" && confirmAddCategory()}
                        />
                        <button onClick={confirmAddCategory}>
                          <Check size={14} />
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {w.step === 4 && (
                  <div className="fh-wizard-body">
                    <p className="fh-wizard-q">揀貨物</p>
                    {w.categories.map((cat) => (
                      <div key={cat} className="fh-wizard-cat-block">
                        <div className="fh-cat-title">
                          {CATEGORY_META[cat] || "🏷️"} {cat}
                        </div>
                        <div className="fh-chip-grid">
                          {(PRESET_ITEMS[cat] || []).map((item) => (
                            <button
                              key={item}
                              className={`fh-chip fh-chip-sm ${
                                (w.itemsByCat[cat] || []).includes(item) ? "active" : ""
                              }`}
                              onClick={() => toggleWizardItem(cat, item)}
                            >
                              {item}
                            </button>
                          ))}
                        </div>
                        <div className="fh-inline-add">
                          <input
                            placeholder="加其他貨物…"
                            value={w.customItemText[cat] || ""}
                            onChange={(e) =>
                              setW((s) => ({
                                ...s,
                                customItemText: { ...s.customItemText, [cat]: e.target.value },
                              }))
                            }
                            onKeyDown={(e) => e.key === "Enter" && confirmAddWizardItem(cat)}
                          />
                          <button onClick={() => confirmAddWizardItem(cat)}>
                            <Plus size={14} />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                <div className="fh-wizard-nav">
                  {w.step > 1 && (
                    <button className="fh-btn-secondary" onClick={prevStep}>
                      <ArrowLeft size={14} /> 返回
                    </button>
                  )}
                  {w.step < 4 && (
                    <button
                      className="fh-btn-primary"
                      disabled={!canGoNext}
                      onClick={nextStep}
                    >
                      下一步
                    </button>
                  )}
                  {w.step === 4 && (
                    <button
                      className="fh-btn-primary"
                      disabled={totalWizardItems === 0}
                      onClick={finishWizard}
                    >
                      完成，建立清單（{totalWizardItems}）
                    </button>
                  )}
                </div>
              </div>
            ) : (
              <>
                <button className="fh-new-trip-btn fh-tone-shop" onClick={startWizard}>
                  <Plus size={16} /> 開始新購物清單
                </button>

                {shoppingLists.length > 0 && (
                  <div className="fh-clear-all-row">
                    {!confirmClearAll ? (
                      <button className="fh-clear-all-btn" onClick={() => setConfirmClearAll(true)}>
                        <Trash2 size={13} /> 清空全部購物清單
                      </button>
                    ) : (
                      <div className="fh-clear-all-confirm">
                        <span>確定要刪晒全部 {shoppingLists.length} 張清單？</span>
                        <div className="fh-clear-all-confirm-actions">
                          <button className="fh-btn-secondary" onClick={() => setConfirmClearAll(false)}>
                            取消
                          </button>
                          <button className="fh-btn-danger" onClick={clearAllShoppingLists}>
                            確定刪除
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {shoppingLists.length === 0 && (
                  <div className="fh-quickstart">
                    <p className="fh-empty">未有購物清單，可以由呢度快速開始：</p>
                    <div className="fh-chip-grid fh-quickstart-chips">
                      <button className="fh-chip" onClick={() => quickStartOutlet("Tesco")}>
                        🛒 Tesco
                      </button>
                      <button className="fh-chip" onClick={() => quickStartOutlet("Sainsbury's")}>
                        🧡 Sainsbury's
                      </button>
                    </div>
                  </div>
                )}

                {shoppingLists.length > 0 && (
                  <button className="fh-chip fh-repeat-chip" onClick={quickStartRepeat}>
                    <RefreshCw size={12} /> 跟返上次（{shoppingLists[0].outlet}）
                  </button>
                )}

                {shoppingLists.map((l) => {
                  const total = l.items.length;
                  const done = l.items.filter((i) => i.done).length;
                  const pct = total ? Math.round((done / total) * 100) : 0;
                  const expanded = expandedListId === l.id;
                  const byCat = {};
                  l.items.forEach((it) => {
                    (byCat[it.category] = byCat[it.category] || []).push(it);
                  });
                  return (
                    <div key={l.id} className="fh-pass fh-shop-card">
                      <div className="fh-pass-notch fh-pass-notch-left" />
                      <div className="fh-pass-notch fh-pass-notch-right" />
                      <button
                        className="fh-pass-head"
                        onClick={() => setExpandedListId(expanded ? null : l.id)}
                      >
                        <div className="fh-pass-head-left">
                          <ShoppingBag size={16} className="fh-shop-icon" />
                          <div>
                            <div className="fh-pass-title">{l.outlet}</div>
                            <div className="fh-pass-sub">
                              <span className="fh-mono">{displayDate(l.date)}</span>
                              <span>{l.categories.map((c) => CATEGORY_META[c] || "🏷️").join(" ")}</span>
                            </div>
                          </div>
                        </div>
                        {expanded ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                      </button>

                      <div className="fh-progress-row">
                        <div className="fh-progress-track">
                          <div className="fh-progress-fill" style={{ width: `${pct}%` }} />
                        </div>
                        <span className="fh-mono fh-progress-label">
                          {total ? `${done}/${total} 買咗` : "未有貨物"}
                        </span>
                      </div>

                      {expanded && (
                        <div className="fh-pass-body">
                          <div className="fh-perforation" />
                          {l.categories.map((cat) => {

                          setEditTripDraft(null);
                        }}
                      >
                        <div className="fh-pass-head-left">
                          <Plane size={16} className="fh-plane-icon" />
                          <div>
                            <div className="fh-pass-title">{t.title}</div>
                            {(t.place || t.start) && (
                              <div className="fh-pass-sub">
                                {t.place && (
                                  <span>
                                    <MapPin size={11} /> {t.place}
                                  </span>
                                )}
                                {t.start && (
                                  <span className="fh-mono">
                                    {t.start}
                                    {t.end ? " – " + t.end : ""}
                                  </span>
                                )}
                              </div>
                            )}
                          </div>
                        </div>
                        <ChevronDown size={16} style={{ transform: "rotate(-90deg)" }} />
                      </button>

                      <div className="fh-progress-row">
                        <div className="fh-progress-track">
                          <div className="fh-progress-fill fh-progress-fill-travel" style={{ width: pct + "%" }} />
                        </div>
                        <span className="fh-mono fh-progress-label">
                          {packTotal ? packDone + "/" + packTotal + " 執好" : "未有行李"}
                        </span>
                      </div>

                      {(todoLeft > 0 || shopLeft > 0) && (
                        <div className="fh-trip-meta">
                          {todoLeft > 0 && <span>行程待辦 {todoLeft}</span>}
                          {shopLeft > 0 && <span>想買 {shopLeft}</span>}
                        </div>
                      )}
                    </div>
                  );
                })}

                {showNewTrip ? (
                  <div className="fh-pass fh-pass-new">
                    <div className="fh-pass-notch fh-pass-notch-left" />
                    <div className="fh-pass-notch fh-pass-notch-right" />
                    <div className="fh-new-trip-form">
                      <input
                        placeholder="旅程名稱，例如：日本"
                        value={newTripTitle}
                        onChange={(e) => setNewTripTitle(e.target.value)}
                      />
                      <input
                        placeholder="目的地（可選）"
                        value={newTripPlace}
                        onChange={(e) => setNewTripPlace(e.target.value)}
                      />
                      <div className="fh-date-row">
                        <input
                          type="date"
                          value={newTripStart}
                          onChange={(e) => setNewTripStart(e.target.value)}
                        />
                        <span>至</span>
                        <input
                          type="date"
                          value={newTripEnd}
                          onChange={(e) => setNewTripEnd(e.target.value)}
                        />
                      </div>
                      <p className="fh-hint">
                        建立之後會自動由範本複製 {(packingTemplate || []).length} 樣執行李嘅嘢過去。
                      </p>
                      <div className="fh-new-trip-actions">
                        <button className="fh-btn-secondary" onClick={() => setShowNewTrip(false)}>
                          取消
                        </button>
                        <button className="fh-btn-primary" onClick={addTrip}>
                          建立旅程
                        </button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <button className="fh-new-trip-btn fh-tone-travel" onClick={() => setShowNewTrip(true)}>
                    <Plus size={16} /> 新增旅程
                  </button>
                )}

                <button className="fh-template-btn" onClick={() => setTemplateOpen(true)}>
                  執行李範本（{(packingTemplate || []).length} 樣）
                </button>
              </>
            )}
          </section>
        )}
      </main>

      {viewPhoto && (
        <div className="fh-lightbox" onClick={() => setViewPhoto(null)}>
          <img src={viewPhoto} alt="" />
          <button className="fh-lightbox-close" onClick={() => setViewPhoto(null)}>
            <X size={18} />
          </button>
        </div>
      )}
    </div>
  );
}

        display: inline-flex; align-items: center; gap: 5px;
        color: var(--ember);
      }

      .fh-clear-all-row { display: flex; justify-content: center; }
      .fh-clear-all-btn {
        background: none; border: none;
        color: var(--ink-soft); font-size: 11.5px;
        cursor: pointer; padding: 4px;
        display: flex; align-items: center; gap: 4px;
      }
      .fh-clear-all-btn:hover { color: var(--red); }
      .fh-clear-all-confirm {
        width: 100%;
        background: #FBEAEA;
        border: 1px solid #F0C4C4;
        border-radius: 10px;
        padding: 10px 12px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .fh-clear-all-confirm span { font-size: 12.5px; color: var(--red); font-weight: 600; }
      .fh-clear-all-confirm-actions { display: flex; gap: 8px; }
      .fh-clear-all-confirm-actions button { flex: 1; padding: 7px; font-size: 12.5px; }
      .fh-btn-danger { background: var(--red); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }

      .fh-new-trip-btn {
        border: 2px dashed var(--line);
        background: none;
        font-weight: 600; font-size: 13px;
        padding: 12px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center; gap: 6px;
        cursor: pointer;
      }
      .fh-new-trip-btn.fh-tone-shop { color: var(--ember); }
      .fh-new-trip-btn.fh-tone-travel { color: var(--accent); }
      .fh-new-trip-form { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
      .fh-new-trip-form input {
        border: 1px solid var(--line); border-radius: 8px;
        padding: 9px 10px; font-size: 13px; font-family: inherit;
      }
      .fh-date-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
      .fh-date-row input { flex: 1; }
      .fh-new-trip-actions { display: flex; gap: 8px; margin-top: 4px; }
      .fh-btn-primary, .fh-btn-secondary {
        border: none; border-radius: 8px; padding: 9px; font-size: 13px;
        font-weight: 600; cursor: pointer;
      }
      .fh-new-trip-actions .fh-btn-primary, .fh-new-trip-actions .fh-btn-secondary { flex: 1; }
      .fh-new-trip-actions .fh-btn-primary { background: var(--accent); }
      .fh-btn-primary { background: var(--vermillion); color: #fff; }
      .fh-btn-secondary { background: var(--paper-alt); color: var(--ink-soft); }

      @media (prefers-reduced-motion: reduce) {
        .fh-spinner, .fh-spin { animation: none; }
      }
    `}</style>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FamilyApp />);
